<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Self-driving ship - No libraries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="shipCanvas"></canvas>
    <div id="verticalButtons">
        <button onclick="save()" title="Save the leading brain, then reload to evolve">Save brain</button>
        <button onclick="disshipd()" title="Clear the saved brain, then reload for a new population">Clear saved brain</button>
        <p id="saveStatus" role="status" aria-live="polite"></p>
    </div>
    <canvas id="networkCanvas"></canvas>
    <script src="visualizer.js"></script>
    <script src="network.js"></script>
    <script src="sensor.js"></script>
    <script src="utils.js"></script>
    <script src="Road.js"></script>
    <script src="controls.js"></script>
    <script src="ship.js"></script>
    <script src="main.js"></script>
</body>
</html>
